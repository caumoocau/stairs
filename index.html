<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MOOCAU × K-MOOC | 완강의 계단!</title>
<meta property="og:title" content="완강의 계단 | MOOCAU × K-MOOC">
<meta property="og:description" content="푸앙이와 함께 K-MOOC 완강 계단 50칸에 도전하세요!">

<style>
@font-face{font-family:'CookieRun';src:url('./fonts/CookieRun-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'CookieRun';src:url('./fonts/CookieRun-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'CookieRun';src:url('./fonts/CookieRun-Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap;}

:root{
  --navy:#143365; --blue:#00a8ff; --deep:#0097e6;
  --pink:#DEACC5; --gold:#f1c40f; --red:#ff6060;
  --wood:#e67e22; --wood-d:#d35400; --grass:#2ecc71; --grass-l:#58d68d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0d1b2a; color:#fff;
  font-family:'CookieRun',sans-serif;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#game{
  position:relative; width:100%; max-width:440px; height:100dvh; max-height:820px;
  background:linear-gradient(180deg,#4facfe 0%,#00f2fe 100%);
  overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.6);
}
@media(min-width:460px){ #game{border:4px solid #fff;border-radius:14px} }
canvas{display:block;width:100%;height:76%;image-rendering:pixelated;touch-action:none}

#hud{position:absolute;top:0;left:0;right:0;padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:3}
.hud-chip{background:rgba(20,32,54,.55);border:2px solid rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;font-size:15px;line-height:1.2;text-shadow:1px 1px 0 #16283f}
#combo{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:20px;color:#fff;text-shadow:2px 2px 0 #16283f;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}
.energy-wrap{width:118px;height:16px;border:2px solid #fff;background:#16283f;border-radius:9px;overflow:hidden;margin-top:5px}
#energy{height:100%;width:100%;background:var(--gold);transition:width .08s linear,background .3s}

#controls{position:absolute;bottom:0;left:0;right:0;height:24%;display:flex;gap:12px;padding:12px;background:#1d2b3a;border-top:4px solid #fff;z-index:4}
.btn{flex:1;border:4px solid #fff;border-radius:14px;color:#fff;font-family:inherit;font-weight:bold;
  font-size:clamp(17px,5.2vw,23px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:transform .05s,box-shadow .05s;touch-action:none}
.btn small{font-size:11px;opacity:.85;font-weight:normal}
#btn-turn{background:var(--blue);box-shadow:0 7px #0074c2}
#btn-climb{background:var(--red);box-shadow:0 7px #c23b3b}
.btn.press{transform:translateY(7px);box-shadow:0 0 currentColor}

.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:18px;overflow-y:auto;background:rgba(13,27,42,.95)}
.screen.show{display:flex}
.screen>*{flex-shrink:0}
#s-start{background:linear-gradient(180deg,#dff3ff 0%,#fdf4ec 52%,#ffeef6 100%);color:#16283f;
  overflow:hidden;padding:clamp(14px,3vh,26px) 18px;gap:clamp(8px,2.1vh,20px)}
#s-start>*:not(#deco){position:relative;z-index:2}
#s-start h1,#s-start .lead,#s-start #nick,#s-start .hint,#s-start .link-btn{margin:0}
#deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.d-sun{position:absolute;top:6%;right:-26px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,#ffe066 0%,#ffd43b 58%,rgba(255,212,59,0) 72%);animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.09);opacity:1}}
.d-cloud{position:absolute;background:rgba(255,255,255,.92);border-radius:999px;box-shadow:0 6px 0 rgba(160,200,230,.28)}
.d-cloud::before,.d-cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.c1{top:12%;left:-90px;width:86px;height:26px;animation:drift 21s linear infinite}
.c1::before{width:38px;height:38px;top:-17px;left:14px}.c1::after{width:28px;height:28px;top:-12px;left:46px}
.c2{top:27%;left:-120px;width:64px;height:20px;opacity:.85;animation:drift 29s linear infinite 3s}
.c2::before{width:28px;height:28px;top:-13px;left:11px}.c2::after{width:22px;height:22px;top:-9px;left:34px}
.c3{top:44%;left:-100px;width:100px;height:28px;opacity:.7;animation:drift 36s linear infinite 8s}
.c3::before{width:44px;height:44px;top:-20px;left:16px}.c3::after{width:32px;height:32px;top:-14px;left:56px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 220px))}}
.d-spark{position:absolute;width:5px;height:5px;background:#fff;box-shadow:0 0 6px #ffe9a8;animation:tw 2.4s ease-in-out infinite}
.p1{top:16%;left:22%}.p2{top:31%;right:26%;animation-delay:.6s}.p3{top:49%;left:16%;animation-delay:1.2s}
.p4{top:63%;right:18%;animation-delay:1.8s}.p5{top:8%;left:66%;animation-delay:.9s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
.d-stairs{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;align-items:flex-end;justify-content:center;gap:0;opacity:.28}
.d-stairs i{width:16.6%;background:var(--wood);border-top:6px solid var(--grass);box-sizing:border-box}
.d-stairs i:nth-child(1){height:20px}.d-stairs i:nth-child(2){height:36px}.d-stairs i:nth-child(3){height:52px}
.d-stairs i:nth-child(4){height:68px}.d-stairs i:nth-child(5){height:84px}.d-stairs i:nth-child(6){height:100px}
#s-start h1{color:var(--blue);font-size:clamp(24px,7.4vw,34px);line-height:1.35;margin-bottom:4px;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 4px 0 #16283f}
#s-start .lead{font-size:13px;color:#5a6b82;margin-bottom:10px;line-height:1.6}
.char-stack{display:flex;flex-direction:column;align-items:center;margin:clamp(2px,1vh,10px) 0}
.char-stack img{width:clamp(80px,25vw,116px);image-rendering:pixelated;margin-bottom:16px;animation:hop 1.1s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(20,40,63,.14))}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.stair-mini{width:clamp(150px,46vw,196px);height:38px;background:var(--wood);border-bottom:9px solid var(--wood-d);border-radius:3px;position:relative;box-shadow:0 8px 0 rgba(20,40,63,.12)}
.stair-mini::before{content:'';position:absolute;top:-16px;left:0;width:100%;height:16px;background:var(--grass);border-top:6px solid var(--grass-l);box-sizing:border-box;border-radius:3px 3px 0 0}
#nick{width:78%;max-width:280px;padding:13px;font-size:18px;text-align:center;font-family:inherit;
  border:4px solid var(--blue);border-radius:8px;background:#fff;color:#16283f;outline:none;margin-bottom:12px}
#nick::placeholder{color:#b2bec3}
.big-btn{padding:14px 44px;font-size:clamp(18px,5.4vw,23px);font-weight:bold;font-family:inherit;cursor:pointer;
  background:var(--blue);color:#fff;border:4px solid #fff;border-radius:10px;box-shadow:0 6px var(--deep)}
.big-btn:active{box-shadow:0 0 var(--deep);transform:translateY(6px)}
.big-btn[disabled]{opacity:.65}
.link-btn{margin-top:12px;background:none;border:none;font-family:inherit;font-size:14px;color:#4a5f7a;text-decoration:underline;cursor:pointer}
#s-start .link-btn{color:#5a6b82}
.hint{margin-top:10px;font-size:12px;color:#7d8fa6;line-height:1.6}

.title-over{color:#ff7675;font-size:clamp(28px,8vw,38px);text-shadow:3px 3px 0 #000;margin-bottom:2px}
.sub-over{font-size:14px;color:#dfe6e9;margin-bottom:8px}
.score-big{font-size:clamp(26px,8vw,34px);color:var(--gold);margin:4px 0 10px}
.score-big small{font-size:14px;color:#b8c4d4}

.cert{width:100%;max-width:330px;background:#fffdf5;border:6px solid #d4af37;border-radius:8px;
  padding:20px 16px;color:#333;box-shadow:0 0 24px rgba(212,175,55,.45);margin-bottom:12px}
.cert h2{color:var(--wood-d);font-size:clamp(24px,7vw,30px);border-bottom:2px solid #d4af37;padding-bottom:6px;margin-bottom:8px;letter-spacing:6px}
.cert h3{color:#2c3e50;font-size:18px;margin:6px 0}
.cert-name{font-size:21px;font-weight:bold;color:var(--blue);margin:12px 0;text-decoration:underline;text-underline-offset:4px}
.cert-desc{font-size:13px;line-height:1.65;color:#555;margin:10px 0}
.cert-time{font-size:18px;font-weight:bold;color:#e74c3c}
.cert-no{font-size:11px;color:#9c8f6a;margin-top:10px;letter-spacing:.5px}

.board{width:100%;max-width:340px;background:rgba(0,0,0,.42);border:2px solid var(--gold);border-radius:8px;
  padding:10px 12px;margin-bottom:12px;max-height:34vh;overflow-y:auto}
.row{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 2px;border-bottom:1px dashed #4a5568;color:#dfe6e9}
.row:last-child{border-bottom:none}
.row.top3{color:var(--gold);font-weight:bold}
.row.me{background:rgba(0,168,255,.22);border-radius:6px}
.r-no{width:26px;text-align:left}
.r-nick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sc{font-size:13px}
.r-t{font-size:11px;color:#9fb0c4;width:52px;text-align:right}
.empty{text-align:center;color:#9fb0c4;font-size:14px;padding:8px}
#rotate-hint{display:none;position:absolute;inset:0;z-index:30;background:#0d1b2a;color:#fff;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:19px;line-height:1.6}
.rot-icon{font-size:52px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media(orientation:landscape) and (max-height:520px){ #rotate-hint{display:flex} }
#s-rank h1{font-size:clamp(22px,6.6vw,28px);color:var(--gold);margin-bottom:10px;text-shadow:2px 2px 0 #000}
.live-badge{display:none;vertical-align:middle;font-size:.4em;letter-spacing:.14em;color:#ff8f8f;
  border:1.5px solid #ff8f8f66;border-radius:999px;padding:3px 10px 3px 8px;text-shadow:none}
.live-badge[hidden]{display:none}
.live-badge:not([hidden]){display:inline-flex;align-items:center;gap:6px}
.live-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff5f5f;
  box-shadow:0 0 8px #ff5f5f;animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.row.justin{animation:rowin 2.2s ease-out}
@keyframes rowin{
  0%{background:#ffe08a;color:#2b2000;transform:translateX(-14px);box-shadow:0 0 0 2px #ffd25e}
  22%{background:#ffe08a;color:#2b2000;transform:none;box-shadow:0 0 0 2px #ffd25e}
  100%{background:transparent;box-shadow:none}
}

/* Event display: decoration appears only while the ranking screen is open. */
.rank-stage{display:block;position:fixed;inset:0;pointer-events:none;overflow:hidden;color:#eaf5ff;background:radial-gradient(ellipse at 50% -10%,#356289 0,transparent 55%),radial-gradient(ellipse at 10% 75%,#173f61 0,transparent 40%),linear-gradient(135deg,#0a1c32,#132d48 50%,#091b30);z-index:0}
body:has(#s-rank.show) .rank-stage{display:block}
#game{z-index:1}
.rank-stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#bfdffb66 1px,transparent 1.5px);background-size:52px 52px;mask-image:linear-gradient(#000,transparent 90%)}
.rank-stage::after{content:'';position:absolute;left:50%;top:50%;width:115vh;height:115vh;border:1px solid #c9e3ff12;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 13vh #b5ddff04,0 0 0 26vh #b5ddff03}
.rank-wing{position:absolute;top:50%;transform:translateY(-50%);width:calc((100vw - min(42vw,680px))/2 - 64px);max-width:490px;z-index:1;text-align:left}
.rank-wing-left{left:3.5vw}.rank-wing-right{right:3.5vw;text-align:center}
.rank-brand{font-size:clamp(12px,1vw,20px);letter-spacing:.16em;color:#b8d6ed;margin-bottom:32px}
.rank-kicker{display:inline-block;border:1px solid #e7c77b80;border-radius:999px;padding:9px 17px;font-size:clamp(11px,.9vw,17px);letter-spacing:.1em;color:#ffe3a2;margin-bottom:22px;background:#d6b9660a}
.rank-wing h2{font-size:clamp(32px,3.1vw,64px);line-height:1.27;letter-spacing:-.035em;color:#fff9e9;font-weight:900;text-shadow:0 5px 24px #0003}
.rank-wing h2 strong{color:#ffda87;font-weight:900}
.rank-wing p{margin-top:26px;font-size:clamp(14px,1.12vw,23px);line-height:1.9;color:#b9d2e5;word-break:keep-all}
.rank-rule{width:48px;height:3px;background:#e8c780;margin:34px 0 0}
.rank-hero{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:36px auto 40px;width:100%;height:clamp(200px,26vh,310px)}
.rank-halo{position:absolute;left:50%;top:45%;width:clamp(200px,20vw,330px);aspect-ratio:1;border:1px solid #e0c98a44;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(#f6db9222,transparent 68%);box-shadow:0 0 0 15px #f6db9205}
.rank-hero img{height:clamp(150px,21vh,240px);width:auto;position:relative;z-index:1;image-rendering:pixelated;filter:drop-shadow(0 12px 8px #0003)}
.rank-plinth{width:clamp(160px,16vw,270px);height:35px;border-top:8px solid #ffe3a0;background:linear-gradient(90deg,#a47834,#d6ae59,#a47834);transform:skewX(-12deg);box-shadow:9px 10px 0 #06182f66}
.rank-goal{font-size:clamp(18px,1.55vw,30px);color:#ffe3a0;letter-spacing:.04em}
.rank-goal b{font-size:1.7em}.rank-wing-right p{margin-top:12px}
.rank-star{position:absolute;font-size:23px;color:#ffe7ac;text-shadow:0 0 24px #ffc65d66}.rank-star.one{left:17%;top:17%}.rank-star.two{right:15%;top:28%;font-size:14px}.rank-star.three{right:24%;bottom:15%;font-size:12px}
.rank-staircase{position:absolute;bottom:-1px;display:flex;align-items:flex-end;width:28vw;gap:0;opacity:.28}.rank-staircase.left{left:0}.rank-staircase.right{right:0;transform:scaleX(-1)}
.rank-staircase i{width:20%;height:6vh;background:linear-gradient(90deg,#264f71,#183852);border-top:3px solid #82b4d766;border-right:1px solid #7bb9db22}
.rank-staircase i:nth-child(2){height:11vh}.rank-staircase i:nth-child(3){height:16vh}.rank-staircase i:nth-child(4){height:21vh}.rank-staircase i:nth-child(5){height:26vh}
.rank-stage-footer{position:absolute;bottom:3vh;left:3.5vw;right:3.5vw;display:flex;justify-content:space-between;font-size:clamp(10px,.75vw,15px);letter-spacing:.12em;color:#92b4ce;z-index:2}
.rank-display-label,.rank-column-labels{display:none}
@media(min-width:1100px) and (min-height:620px){
 body:has(#s-rank.show) #game{width:min(42vw,680px);max-width:none;height:94dvh;max-height:1100px;border:1px solid #e4c67e99;border-radius:24px;box-shadow:0 30px 100px #0006,0 0 0 7px #d9c18409}
 #s-rank{padding:clamp(22px,3vh,40px) clamp(22px,2.4vw,45px) 18px;gap:0;background:linear-gradient(160deg,#1c3954fa,#10273dfc);justify-content:flex-start;overflow-y:auto}
 #s-rank .rank-display-label{display:block;font-size:clamp(10px,.8vw,15px);letter-spacing:.25em;color:#9fc1d8;margin:0 0 10px}
 #s-rank h1{font-size:clamp(28px,2.5vw,48px);margin:0 0 20px;color:#ffe5a6;line-height:1.3}
 .rank-column-labels{display:flex;align-items:center;width:100%;padding:0 16px 10px;gap:12px;font-size:clamp(10px,.85vw,16px);color:#a3bfd2;border-bottom:1px solid #c9dfff26}
 .rank-column-labels span:first-child{width:38px}.rank-column-labels span:nth-child(2){flex:1;text-align:left}.rank-column-labels span:last-child{text-align:right}
 #board-rank{display:flex;flex-direction:column;max-width:none;max-height:none;min-height:0;flex:1 1 auto;width:100%;margin:0 0 14px;padding:0 12px;border:0;border-radius:0;background:transparent;box-shadow:none;overflow-y:auto}
 #board-rank .row{min-height:0;flex:1 0 auto;padding:clamp(7px,1.2vh,15px) 4px;gap:12px;font-size:clamp(16px,1.3vw,26px);border-bottom:1px solid #b4cce021}
 #board-rank .r-no{width:38px;flex-shrink:0;text-align:center}#board-rank .r-sc{font-size:clamp(14px,1.05vw,22px);white-space:nowrap}#board-rank .r-t{display:none}
 #board-rank .row.top3{color:#ffe3a1;background:linear-gradient(90deg,#ffcf7020,transparent);border-radius:9px;margin-top:3px}#board-rank .row.top3:first-child{background:linear-gradient(90deg,#ffcf7033,transparent)}
 #board-rank .empty{font-size:20px;line-height:1.8;padding:32px 0}
 #s-rank #btn-rank-close{font-size:14px;min-height:36px;padding:8px 24px;max-width:180px;box-shadow:0 3px #084e7a}
 #s-rank #btn-reset{min-height:30px;padding:8px;margin:6px 0 0;font-size:10px;color:#acc4d5}
}
@media(max-width:1099px),(max-height:619px){.rank-wing,.rank-stage-footer,.rank-staircase{display:none}}
@media(min-width:1100px) and (max-height:760px){#s-rank h1{margin-bottom:10px}#s-rank{padding-top:20px}#board-rank .row{padding:7px 4px;font-size:17px}.rank-brand{margin-bottom:18px}.rank-wing p{margin-top:18px}.rank-hero{margin:18px auto}.rank-wing h2{font-size:36px}}


/* Bright, decorative ranking backdrop — no extra text. */
.rank-stage{background:radial-gradient(ellipse at 13% 15%,#fff9dc 0,transparent 30%),radial-gradient(ellipse at 91% 78%,#ffe1ee 0,transparent 42%),linear-gradient(160deg,#bfeaff 0%,#e1f6ff 48%,#e9e3ff 100%)}
.rank-stage::before{background-image:radial-gradient(#ffffffb3 2px,transparent 2.5px);background-size:58px 58px;mask-image:none;opacity:.65}
.rank-stage::after{width:115vh;height:115vh;border:2px solid #ffffff55;box-shadow:0 0 0 13vh #ffffff12,0 0 0 26vh #ffffff0a}
.rank-sun{position:absolute;top:9%;left:10%;width:clamp(70px,8vw,150px);aspect-ratio:1;background:#ffdf8d;border:10px solid #fff0bf;border-radius:50%;box-shadow:0 0 0 20px #ffffff40}
.rank-cloud{position:absolute;width:clamp(120px,15vw,290px);height:clamp(35px,4vw,75px);border-radius:100px;background:#fffffff0;box-shadow:0 10px 0 #9ec9e519}
.rank-cloud::before,.rank-cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;bottom:25%;width:45%;aspect-ratio:1;left:12%}.rank-cloud::after{width:33%;left:49%;bottom:32%}
.rank-cloud.c1{left:-3%;top:36%;transform:rotate(-7deg)}.rank-cloud.c2{right:4%;top:23%;transform:scale(.85)}.rank-cloud.c3{left:8%;bottom:13%;transform:scale(1.15)}.rank-cloud.c4{right:-4%;bottom:12%;transform:scale(1.2)}
.rank-puang{position:absolute;z-index:2;width:clamp(95px,13vw,245px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 12px 0 #74b6d426)}
.rank-puang.p1{left:8%;bottom:23%;transform:rotate(-9deg)}.rank-puang.p2{right:8%;top:40%;transform:rotate(10deg) scaleX(-1);width:clamp(85px,11vw,210px)}
.rank-spark{position:absolute;width:22px;aspect-ratio:1;background:#fff9ca;clip-path:polygon(50% 0,63% 36%,100% 50%,63% 64%,50% 100%,37% 64%,0 50%,37% 36%)}
.rank-spark.s1{left:23%;top:44%}.rank-spark.s2{right:5%;top:38%;width:32px}.rank-spark.s3{right:23%;bottom:23%;background:#fff}.rank-spark.s4{left:5%;bottom:40%;width:15px;background:#fff}
.rank-staircase{opacity:.6;z-index:1}.rank-staircase i{background:linear-gradient(90deg,#afd9f4,#c3e7fa);border-top:5px solid #f3fcff;border-right:1px solid #fff8;border-radius:8px 8px 0 0}.rank-staircase.right i{background:linear-gradient(90deg,#cdc4ed,#e2d7f6);border-top-color:#fff4fd}
@media(min-width:1100px) and (min-height:620px){#game{border:2px solid #ffffffdd;border-radius:24px;box-shadow:0 24px 70px #527ba333,0 0 0 8px #ffffff40}}
@media(max-width:1099px),(max-height:619px){.rank-puang,.rank-sun,.rank-cloud,.rank-spark{display:none}}

</style>

let W=400,H=600,SC=1,DPR=Math.min(2,window.devicePixelRatio||1);
const SW=70, SH=45;
let baseX=200, baseY=430;

function relayout(){
  const r=CV.getBoundingClientRect();
  const cw=Math.max(240,r.width), ch=Math.max(240,r.height);
  CV.width=Math.round(cw*DPR); CV.height=Math.round(ch*DPR);
  SC=cw/400; W=400; H=ch/SC;
  CX.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  CX.imageSmoothingEnabled=false;
  baseX=200; baseY=Math.min(H*0.74,H-120);
  if(S) draw();
}

let S=null, raf=null, lastT=0, nick='푸앙이', myKey=null;

function newState(){
  const clouds=[],stars=[];
  for(let i=0;i<7;i++) clouds.push({x:Math.random()*400,y:Math.random()*700,size:14+Math.random()*24,speed:.12+Math.random()*.35,depth:Math.random()});
  const sc=['#ffffff','#ffeaa7','#74b9ff','#fab1a0'];
  for(let i=0;i<80;i++) stars.push({x:Math.random()*400,y:Math.random()*900,size:Math.random()*1.9+.6,op:Math.random(),c:sc[Math.floor(Math.random()*sc.length)]});
  return {score:0,energy:100,dead:false,cleared:false,over:false,
    px:0,py:0,dir:1, rx:0,ry:0, hop:0, camY:0, camT:0,
    steps:[], parts:[], pops:[], shake:0, fall:0, t0:0, best:0,
    clouds,stars, reason:''};
}
function addStep(){
  const last=S.steps[S.steps.length-1];
  let d=Math.random()>0.5?1:-1;
  if(last.x>=MAXX) d=-1; else if(last.x<=-MAXX) d=1;
  S.steps.push({x:last.x+d,y:last.y+1});
}
function initGame(){
  S=newState();
  S.steps.push({x:0,y:0});
  for(let i=0;i<24;i++) addStep();
  S.t0=performance.now();
  updateHUD(); paintSky();
  lastT=0;
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function updateHUD(){
  $('sc').textContent=S.score;
  const e=Math.max(0,S.energy);
  $('energy').style.width=e+'%';
  $('energy').style.background= e<25? '#ff6060' : e<50? '#ffa502' : '#f1c40f';
}
function paintSky(){
  const p=Math.min(S.score/(GOAL*1.1),1);
  const lerp=(a,b)=>Math.round(a+(b-a)*p);
  GAME.style.background=`linear-gradient(180deg,rgb(${lerp(79,12)},${lerp(172,14)},${lerp(254,46)}) 0%,rgb(${lerp(0,44)},${lerp(242,40)},${lerp(254,96)}) 100%)`;
}
function burst(x,y,col,n){
  for(let i=0;i<(n||10);i++) S.parts.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*160-30,t:.55,col});
}
function pop(txt,col){ S.pops.push({txt,col,t:.9,y:0}); }

function step(turn){
  if(!S||S.over||S.dead) return;
  if(turn) S.dir*=-1;
  const nx=S.px+S.dir, ny=S.py+1;
  const target=S.steps[ny];
  if(target && target.x===nx){
    S.px=nx; S.py=ny; S.score++; S.hop=1;
    S.energy=Math.min(100,S.energy+7.5);
    S.camT=S.py*SH;
    addStep();
    updateHUD(); paintSky();
    const sx=baseX+S.px*SW, sy=baseY-2;
    burst(sx,sy,'rgba(255,255,255,.9)',6);
    if(S.score%10===0 && S.score<GOAL) pop(S.score+'칸 돌파!','#ffe066');
    if(S.score>=GOAL) return clear();
  } else {
    S.px=nx; S.py=ny; S.dead=true; S.fall=0; S.shake=1; S.reason='발을 헛디뎠어요!';
    setTimeout(()=>gameOver(),780);
  }
}
function clear(){
  S.over=true; S.cleared=true;
  const ms=performance.now()-S.t0;
  const secs=(ms/1000).toFixed(2);
  $('cert-nick').textContent=nick+' 님';
  $('cert-time').textContent=secs;
  const d=new Date(), p=v=>String(v).padStart(2,'0');
  $('cert-no').textContent='제 '+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+' 호  ·  MOOCAU';
  show('s-clear');
  submit(S.score,ms,'board-clear');
}
function gameOver(){
  if(S.over) return;
  S.over=true;
  const ms=performance.now()-S.t0;
  $('final-sc').textContent=S.score;
  $('final-extra').textContent= S.score>=40? '· 조금만 더!' : S.score>=20? '· 반은 왔어요' : '';
  $('over-reason').textContent=S.reason||'에너지가 바닥났어요!';
  show('s-over');
  submit(S.score,ms,'board-over');
}

function loop(t){
  if(!lastT) lastT=t;
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  update(dt); draw();
  raf=requestAnimationFrame(loop);
}
function update(dt){
  if(!S.over && !S.dead){
    S.energy-=(6.2+S.score*0.11)*dt;
    if(S.energy<=0){ S.energy=0; S.reason='에너지가 바닥났어요!'; S.dead=true; S.fall=0; S.shake=.6; setTimeout(()=>gameOver(),600); }
    updateHUD();
  }
  S.camY+=(S.camT-S.camY)*Math.min(1,dt*16);
  S.rx+=(S.px-S.rx)*Math.min(1,dt*22);
  S.ry+=(S.py-S.ry)*Math.min(1,dt*22);
  S.hop=Math.max(0,S.hop-dt*7);
  S.shake=Math.max(0,S.shake-dt*2.6);
  if(S.dead) S.fall+=dt;
  S.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.t-=dt});
  S.parts=S.parts.filter(p=>p.t>0);
  S.pops.forEach(p=>{p.t-=dt;p.y-=28*dt});
  S.pops=S.pops.filter(p=>p.t>0);
  const c=$('combo');
  if(S.pops.length){ c.textContent=S.pops[S.pops.length-1].txt; c.style.color=S.pops[S.pops.length-1].col; c.style.opacity=1; }
  else c.style.opacity=0;
}

function draw(){
  const p=Math.min(S.score/(GOAL*1.1),1);
  CX.clearRect(0,0,W,H);
  CX.save();
  if(S.shake>0) CX.translate((Math.random()-.5)*9*S.shake,(Math.random()-.5)*7*S.shake);

  if(p<.62){
    CX.fillStyle=`rgba(255,221,89,${Math.max(0,1-p*1.7)})`;
    CX.beginPath(); CX.arc(322,120+S.camY*.03,38,0,7); CX.fill();
  }
  if(p>.18){
    const a=(p-.18)*1.3;
    S.stars.forEach(s=>{
      s.op+=(Math.random()-.5)*.12; s.op=Math.max(.25,Math.min(1,s.op));
      CX.globalAlpha=Math.min(1,s.op*a); CX.fillStyle=s.c;
      const y=((s.y+S.camY*.06)%(H+260))-130;
      CX.fillRect(s.x,y,s.size*1.6,s.size*1.6);
    });
    CX.globalAlpha=1;
    const my=76+S.camY*.02, ma=Math.min(1,(p-.18)*2.2);
    CX.fillStyle=`rgba(223,228,234,${ma})`; CX.beginPath(); CX.arc(74,my,33,0,7); CX.fill();
    CX.fillStyle=`rgba(164,176,190,${ma})`;
    CX.fillRect(56,my-9,11,11); CX.fillRect(80,my+5,14,9); CX.fillRect(70,my-20,7,7);
  }
  if(p<1){
    S.clouds.forEach(c=>{
      c.x-=c.speed; if(c.x<-110) c.x=510;
      const y=((c.y+S.camY*.16)%(H+280))-90;
      CX.globalAlpha=(.35+c.depth*.5)*(1-p); CX.fillStyle='#fff';
      CX.beginPath(); CX.arc(c.x,y,c.size,0,7);
      CX.arc(c.x+c.size*.85,y-c.size*.32,c.size*.78,0,7);
      CX.arc(c.x+c.size*1.55,y,c.size*.88,0,7); CX.fill();
      CX.globalAlpha=1;
    });
  }

  const gY=baseY+SH+S.camY;
  if(gY<H+180){
    CX.fillStyle='#27ae60'; CX.fillRect(0,gY-10,400,20);
    CX.fillStyle='#2ecc71'; CX.fillRect(0,gY+10,400,30);
    CX.fillStyle='#e67e22'; CX.fillRect(0,gY+40,400,H+200);
    CX.fillStyle='#d35400'; CX.fillRect(0,gY+56,400,7); CX.fillRect(0,gY+82,400,11);
    CX.fillStyle='rgba(0,0,0,.18)'; CX.fillRect(36,gY+4,48,9);
    CX.fillStyle='#6e3c1b'; CX.fillRect(50,gY-38,18,46);
    CX.fillStyle='#2ecc71'; CX.fillRect(20,gY-78,78,48);
    CX.fillStyle='#58d68d'; CX.fillRect(30,gY-78,38,18);
    CX.fillStyle='rgba(0,0,0,.18)'; CX.fillRect(306,gY+4,56,9);
    CX.fillStyle='#6e3c1b'; CX.fillRect(325,gY-48,18,56);
    CX.fillStyle='#2ecc71'; CX.fillRect(296,gY-98,78,58);
    CX.fillStyle='#58d68d'; CX.fillRect(306,gY-98,38,23);
  }

  for(let i=0;i<S.steps.length;i++){
    const st=S.steps[i];
    const x=baseX+st.x*SW-SW/2, y=baseY-st.y*SH+S.camY;
    if(y<-SH*2||y>H+SH) continue;
    const goal=(i===GOAL);
    CX.fillStyle='rgba(0,0,0,.10)'; CX.fillRect(x+4,y+SH-4,SW,8);
    CX.fillStyle= goal? '#f39c12':'#d35400'; CX.fillRect(x,y+8,SW,SH-8);
    CX.fillStyle= goal? '#f1c40f':'#e67e22'; CX.fillRect(x,y,SW,SH-8);
    CX.fillStyle= goal? '#e74c3c':'#2ecc71'; CX.fillRect(x,y-6,SW,14);
    CX.fillStyle= goal? '#ff7979':'#58d68d'; CX.fillRect(x+4,y-2,SW-8,6);
    if(i>0 && i%10===0 && !goal){
      CX.fillStyle='rgba(255,255,255,.92)'; CX.font='bold 13px CookieRun,sans-serif'; CX.textAlign='center';
      CX.fillText(i, x+SW/2, y+30);
    }
    if(goal){
      CX.fillStyle='#fff'; CX.font='bold 13px CookieRun,sans-serif'; CX.textAlign='center';
      CX.fillText('GOAL', x+SW/2, y+32);
      CX.fillStyle='rgba(241,196,15,.30)';
      CX.beginPath(); CX.arc(x+SW/2,y,58,0,7); CX.fill();
    }
  }

  S.parts.forEach(pt=>{ CX.globalAlpha=Math.max(0,pt.t/.55); CX.fillStyle=pt.col; CX.fillRect(pt.x-2,pt.y-2,5,5); CX.globalAlpha=1; });

  const arc=Math.sin(S.hop*Math.PI)*20;
  let pxp=baseX+S.rx*SW;
  let pyp=baseY-S.ry*SH+S.camY-arc;
  if(S.dead) pyp+=S.fall*S.fall*900;
  const ph=76, pw=ph*(IMG.naturalWidth/IMG.naturalHeight||0.87);
  CX.save();
  CX.translate(pxp,pyp);
  if(S.dead) CX.rotate(S.fall*3.2);
  if(S.dir===1) CX.scale(-1,1);
  CX.fillStyle='rgba(0,0,0,.16)';
  if(!S.dead){ CX.beginPath(); CX.ellipse(0,-2,pw*.30,6,0,0,7); CX.fill(); }
  if(IMG.complete&&IMG.naturalHeight) CX.drawImage(IMG,-pw/2,-ph,pw,ph);
  else { CX.fillStyle='#4facfe'; CX.fillRect(-18,-52,36,52); }
  CX.restore();

  CX.restore();
}

/* ── 화면 전환 ── */
function show(id){
  ['s-start','s-over','s-clear','s-rank'].forEach(s=>$(s).classList.toggle('show',s===id));
}
function hideAll(){ ['s-start','s-over','s-clear','s-rank'].forEach(s=>$(s).classList.remove('show')); }

/* ── 랭킹 (Firebase REST) ── */
const LKEY='moocau_stairs_local';
function localList(){ try{ return JSON.parse(localStorage.getItem(LKEY))||[] }catch(e){ return [] } }
function localSave(l){ try{ localStorage.setItem(LKEY,JSON.stringify(l.slice(0,200))) }catch(e){} }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function fetchScores(){
  try{
    const r=await fetch(DB+'/scores.json',{cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json()||{};
    const list=Object.entries(d).map(([k,v])=>Object.assign({key:k},v));
    list.sort((a,b)=>(b.metric-a.metric)||(a.at-b.at));
    localSave(list);
    return {list,online:true};
  }catch(e){
    const list=localList(); list.sort((a,b)=>(b.metric-a.metric)||(a.at-b.at));
    return {list,online:false};
  }
}
function metricOf(score,ms){ return score*10000000-Math.round(ms); }

async function submit(score,ms,boxId){
  const now=new Date(), p=v=>String(v).padStart(2,'0');
  const rec={nick,score,ms:Math.round(ms),metric:metricOf(score,ms),
    time:p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds()),at:Date.now()};
  try{
    const r=await fetch(DB+'/scores.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
    const j=await r.json(); myKey=j&&j.name||null;
  }catch(e){
    myKey='local-'+rec.at; rec.key=myKey;
    const l=localList(); l.push(rec); localSave(l);
  }
  renderBoard(boxId);
}
let seenKeys=null;
async function renderBoard(boxId,silent){
  const box=$(boxId);
  if(!silent) box.innerHTML='<div class="empty">랭킹 불러오는 중...</div>';
  const {list,online}=await fetchScores();
  if(!list.length){ box.innerHTML='<div class="empty">아직 기록이 없어요.<br>첫 완강의 주인공이 되어보세요!</div>'; return; }
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
  box.innerHTML=(online?'':'<div class="empty" style="color:#ff9f9f">오프라인 · 이 기기 기록만 표시</div>')+
    list.slice(0,10).map((r,i)=>
    `<div class="row ${i<3?'top3':''} ${r.key&&r.key===myKey?'me':''} ${(boxId==='board-rank'&&seenKeys&&r.key&&!seenKeys.has(r.key))?'justin':''}">
      <span class="r-no">${medal(i)}</span>
      <span class="r-nick">${esc(r.nick)}</span>
      <span class="r-sc">${r.score}칸${r.score>=GOAL?` <b>${(r.ms/1000).toFixed(2)}초</b>`:''}</span>
      <span class="r-t">${r.time||''}</span>
    </div>`).join('');
  if(boxId==='board-rank') seenKeys=new Set(list.slice(0,10).map(r=>r.key));
}
async function nickTaken(n){
  const {list}=await fetchScores();
  return list.some(r=>r.nick===n);
}

/* ── 입력 ── */
let lock=false;
function act(turn){
  if(lock) return; lock=true; setTimeout(()=>lock=false,70);
  step(turn);
}
function bindBtn(id,turn){
  const b=$(id);
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.classList.add('press'); act(turn); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('press')));
}
bindBtn('btn-turn',true); bindBtn('btn-climb',false);
CV.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=CV.getBoundingClientRect();
  act((e.clientX-r.left)<r.width/2);
});
document.addEventListener('keydown',e=>{
  if($('s-start').classList.contains('show')){ if(e.key==='Enter') startGame(); return; }
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){ e.preventDefault(); act(true); }
  else if(k==='arrowright'||k==='d'||e.code==='Space'||k==='arrowup'||k==='w'){ e.preventDefault(); act(false); }
});

/* ── 시작 / 종료 ── */
async function startGame(){
  const v=$('nick').value.trim();
  if(!v){ alert('랭킹에 등록할 닉네임을 입력해 주세요!'); $('nick').focus(); return; }
  const b=$('btn-start'); b.disabled=true; b.textContent='확인 중...';
  const taken=await nickTaken(v.slice(0,8));
  b.disabled=false; b.textContent='게임 시작';
  if(taken){ alert('이미 사용 중인 닉네임이에요.\n다른 닉네임을 입력해 주세요!'); $('nick').select(); return; }
  nick=v.slice(0,8); myKey=null;
  hideAll(); relayout(); initGame();
}
function backToStart(){
  $('nick').value=''; show('s-start');
  if(raf) cancelAnimationFrame(raf), raf=null;
  S=newState(); S.steps.push({x:0,y:0}); for(let i=0;i<24;i++) addStep();
  paintSky(); updateHUD(); relayout();
}
$('btn-start').addEventListener('click',startGame);
$('btn-retry').addEventListener('click',backToStart);
$('btn-again').addEventListener('click',backToStart);
/* ── 랭킹 실시간 갱신 ── */
let rankES=null, rankPoll=null;
function rankLiveStop(){
  if(rankES){ try{ rankES.close(); }catch(e){} rankES=null; }
  if(rankPoll){ clearInterval(rankPoll); rankPoll=null; }
  $('rank-live').hidden=true;
}
function rankLiveStart(){
  rankLiveStop();
  seenKeys=null;
  try{
    rankES=new EventSource(DB+'/scores.json');
    rankES.onopen=()=>{ $('rank-live').hidden=false; };
    const onData=()=>{ if($('s-rank').classList.contains('show')) renderBoard('board-rank',true); };
    rankES.addEventListener('put',onData);
    rankES.addEventListener('patch',onData);
    rankES.onerror=()=>{ $('rank-live').hidden=true; };
  }catch(e){ rankES=null; }
  rankPoll=setInterval(()=>{
    if(!$('s-rank').classList.contains('show')){ rankLiveStop(); return; }
    if(!rankES || rankES.readyState!==1) renderBoard('board-rank',true);
  },8000);
}
function openRank(){ show('s-rank'); renderBoard('board-rank'); rankLiveStart(); }
$('btn-rank-start').addEventListener('click',openRank);
$('btn-rank-close').addEventListener('click',()=>{ rankLiveStop(); show('s-start'); });
$('btn-reset').addEventListener('click',async()=>{
  const pw=prompt('운영자 비밀번호를 입력하세요');
  if(pw===null) return;
  if(pw!==ADMIN_PW){ alert('비밀번호가 올바르지 않습니다.'); return; }
  if(!confirm('랭킹 기록을 전부 삭제할까요? (되돌릴 수 없음)')) return;
  try{ await fetch(DB+'/scores.json',{method:'DELETE'}); }catch(e){}
  localSave([]); myKey=null; renderBoard('board-rank'); alert('랭킹이 초기화되었습니다.');
});
$('nick').addEventListener('keydown',e=>e.stopPropagation());

let rt=null;
addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(relayout,120); });
addEventListener('orientationchange',()=>setTimeout(relayout,250));
IMG.addEventListener('load',()=>{ if(S) draw(); });

backToStart();
// Repaint canvas labels once the actual font files are available.
document.fonts.ready.then(()=>{if(S)draw()});
</script>
